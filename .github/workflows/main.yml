name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

# Образ публикуется из push: параллельные прогоны ждут друг друга, а не
# отменяются, чтобы не оборвать публикацию.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  call:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      branch: main
      tag: v1
